      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.06);

      transform: translateY(-2px);
      background: #1B2540;
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);

    // Initialize LocalStorage State
    function initLocalStorage() {
      const savedTasks = localStorage.getItem('hitek_todo_tasks');
      if (savedTasks) {
        const parsed = JSON.parse(savedTasks);
        tasks.forEach(t => {
          const match = parsed.find(pt => pt.id === t.id);
          if (match) t.completed = match.completed;
        });
      } else {
        localStorage.setItem('hitek_todo_tasks', JSON.stringify(tasks));
      }
    }

    // Toggle Task status
    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        localStorage.setItem('hitek_todo_tasks', JSON.stringify(tasks));

        // Dynamic Toast
        const message = task.completed ? `Đã hoàn thành: ${task.text}` : `Đã chuyển sang hàng chờ: ${task.text}`;
        showToast(message, task.completed ? 'success' : 'info');

        // Rerender layout
        renderActiveTab();
      }
    }

    // Toast Utility
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      const toastIconBg = document.getElementById('toast-icon-bg');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.innerText = message;

      // Update styling based on type
      if (type === 'success') {
        toastIconBg.className = 'w-6 h-6 rounded-full bg-success/15 flex items-center justify-center text-success';
        toastIcon.setAttribute('data-lucide', 'check-circle');
      } else if (type === 'warn') {
        toastIconBg.className = 'w-6 h-6 rounded-full bg-warning/15 flex items-center justify-center text-warning';
        toastIcon.setAttribute('data-lucide', 'alert-triangle');
      } else {
        toastIconBg.className = 'w-6 h-6 rounded-full bg-primary/15 flex items-center justify-center text-primary-light';
        toastIcon.setAttribute('data-lucide', 'info');
      }

      lucide.createIcons();

      toast.className = "fixed bottom-6 right-6 z-50 transform translate-y-0 opacity-100 transition-all duration-300";
      setTimeout(() => {
        toast.className = "fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none";
      }, 3500);
    }

      renderSidebar();

    // Demo CV Parsing Simulation
    function startDemoParsing() {
      const uploader = document.getElementById('demo-uploader-content');
      const loader = document.getElementById('demo-uploader-loading');
      const bar = document.getElementById('demo-progress-bar');
      const statusText = document.getElementById('demo-status-text');
      const resultZone = document.getElementById('demo-result-zone');

      if (!uploader || !loader || !bar || !statusText || !resultZone) return;

      uploader.classList.add('hidden');
      loader.classList.remove('hidden');
      bar.style.width = '0%';
      resultZone.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full text-text-muted">
          <i data-lucide="loader" class="size-6 animate-spin text-primary-light mb-2"></i>
          <span class="text-xs">Đang chờ phân tích dữ liệu...</span>
        </div>
      `;
      lucide.createIcons();

      const steps = [
        { progress: '15%', text: 'Đọc dữ liệu nhị phân PDF (pdf-parse)...' },
        { progress: '45%', text: 'Trích xuất thực thể NLP (Họ tên, Kỹ năng, Số năm kinh nghiệm)...' },
        { progress: '75%', text: 'Đối chiếu từ khóa với đặc tả JD Business Analyst...' },
        { progress: '90%', text: 'Tính toán Match Score & sinh đánh giá tự động...' },
        { progress: '100%', text: 'Hoàn tất!' }
      ];

      let currentStep = 0;
      const interval = setInterval(() => {
        if (currentStep < steps.length) {
          bar.style.width = steps[currentStep].progress;
          statusText.innerText = steps[currentStep].text;
          currentStep++;
        } else {
          clearInterval(interval);
          showToast('Phân tích CV thành công!', 'success');

          // Show parsed CV result
          resultZone.innerHTML = `
            <div class="w-full space-y-3.5 text-left animate-[fadeIn_0.3s_ease-out]">
              <div class="flex justify-between items-center">
                <div>
                  <h4 class="text-[13.5px] font-bold text-text-primary">Nguyễn Trần Đạt</h4>
                  <span class="text-[11px] text-text-muted">Vị trí ứng tuyển: Senior Business Analyst</span>
                </div>
                <span class="text-xs font-display font-bold text-success bg-success/10 px-2.5 py-0.5 rounded border border-success/20">92% Match</span>
              </div>
              <div class="grid grid-cols-2 gap-3 text-[11px]">
                <div class="bg-[#161E30] p-2 rounded border border-border">
                  <span class="text-text-muted block">Kỹ năng cốt lõi:</span>
                  <span class="text-text-primary font-medium block truncate" title="SQL, UML, SRS, Agile/Scrum">SQL, UML, SRS, Agile/Scrum</span>
                </div>
                <div class="bg-[#161E30] p-2 rounded border border-border">
                  <span class="text-text-muted block">Kinh nghiệm:</span>
                  <span class="text-text-primary font-medium block">5.5 năm (Đạt yêu cầu JD)</span>
                </div>
              </div>
              <div class="text-[11px] text-text-muted leading-relaxed">
                <span class="text-success font-semibold">Nhận xét AI:</span> Ứng viên sở hữu bộ kỹ năng phân tích nghiệp vụ xuất sắc, có kinh nghiệm quản lý dự án Fintech. Đạt ngưỡng đi tiếp vào vòng phỏng vấn.
              </div>
            </div>
          `;
          lucide.createIcons();

          // Reset demo button after a while
          setTimeout(() => {
            loader.classList.add('hidden');
            uploader.classList.remove('hidden');
          }, 6000);
        }
      }, 600);
    }
