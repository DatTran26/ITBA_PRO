# Town Hown production — host port 2005
# Install: sites-enabled + nginx -t && systemctl reload nginx
# TLS: terminate at this vhost or at Cloudflare (then proxy HTTP to 2005).

server {
    listen 80;
    listen [::]:80;
    server_name production.wpcteam.shop;

    location / {
        proxy_pass http://127.0.0.1:2005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
