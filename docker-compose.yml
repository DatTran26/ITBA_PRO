name: ${COMPOSE_PROJECT_NAME:-town-hown}

services:
  vision-ai-api:
    build:
      context: ./modules/vision-ai/backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-town-hown}-vision-ai-api
    environment:
      FACE_DATA_DIR: /data/faces
      FACE_MODEL_NAME: ${FACE_MODEL_NAME:-buffalo_l}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.75}
      BEHAVIOR_MODEL_PATH: ${BEHAVIOR_MODEL_PATH:-/models/behavior.pt}
      BEHAVIOR_CONFIDENCE: ${BEHAVIOR_CONFIDENCE:-0.25}
      BEHAVIOR_LABELS: ${BEHAVIOR_LABELS:-smoke,Cigarette,empty_seat,un-occupied_desk}
    volumes:
      - ${FACE_DATA_HOST_DIR:-./data/vision-ai/faces}:/data/faces
      - ${VISION_AI_MODEL_HOST_DIR:-./models/vision-ai}:/models:ro
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  vision-ocr-api:
    build:
      context: ./modules/vision-ocr/backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-town-hown}-vision-ocr-api
    env_file:
      - path: .env
        required: false
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      CORS_ALLOWED_ORIGINS: ${VISION_OCR_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://web:3000}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ${DOCKER_IMAGE:-ghcr.io/dattran26/down-town:local}
    container_name: ${COMPOSE_PROJECT_NAME:-town-hown}-web
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_ENABLE_TURNSTILE: ${NEXT_PUBLIC_ENABLE_TURNSTILE:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      NEXT_PUBLIC_ENABLE_TURNSTILE: ${NEXT_PUBLIC_ENABLE_TURNSTILE:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      VISION_OCR_URL: ${VISION_OCR_URL:-http://vision-ocr-api:8000}
      VISION_AI_URL: ${VISION_AI_URL:-http://vision-ai-api:8000}
      SMTP_PASSWORD_ENCRYPTION_KEY: ${SMTP_PASSWORD_ENCRYPTION_KEY:-}
    depends_on:
      vision-ai-api:
        condition: service_healthy
      vision-ocr-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
