# /.gitlab-ci.yml
stages:
  - build
  - deploy

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - |
      export APP_VERSION=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' Frontend/package.json | head -n 1)
      if [ -z "$APP_VERSION" ]; then echo "Error: Could not extract version from package.json"; exit 1; fi
      export DOCKER_IMAGE_VERSION=$CI_REGISTRY_IMAGE:$APP_VERSION
  script:
    - docker build
      --build-arg NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
      --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY
      -t $DOCKER_IMAGE_VERSION
      -t $CI_REGISTRY_IMAGE:latest
      -f Frontend/Dockerfile Frontend
    - docker push $DOCKER_IMAGE_VERSION
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - release

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $VPS_IP >> ~/.ssh/known_hosts
    - |
      export APP_VERSION=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' Frontend/package.json | head -n 1)
      if [ -z "$APP_VERSION" ]; then echo "Error: Could not extract version from package.json"; exit 1; fi
      export DOCKER_IMAGE_VERSION=$CI_REGISTRY_IMAGE:$APP_VERSION
  script:
    - |
      echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" > .env
      echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> .env
      echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env
      echo "DATABASE_URL=$DATABASE_URL" >> .env
      echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> .env
      echo "OPENAI_MODEL=$OPENAI_MODEL" >> .env
    - scp -o StrictHostKeyChecking=no docker-compose.yml .env $VPS_USER@$VPS_IP:/app/itba-ai/
    - ssh $VPS_USER@$VPS_IP "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh $VPS_USER@$VPS_IP "cd /app/itba-ai && DOCKER_IMAGE=$DOCKER_IMAGE_VERSION docker compose pull && DOCKER_IMAGE=$DOCKER_IMAGE_VERSION docker compose up -d --force-recreate"


  only:
    - release
