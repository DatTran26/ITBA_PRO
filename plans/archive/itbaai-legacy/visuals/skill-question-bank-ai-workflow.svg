<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 985" font-family="Inter,-apple-system,sans-serif">
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#059669"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="985" fill="#f8fafc"/>
  <rect x="8" y="8" width="1184" height="969" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="600" y="31" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">AI Workflow: Skill &amp; Question Bank Pipeline</text>
  <text x="600" y="49" font-size="11" text-anchor="middle" fill="#64748b">Supabase Edge Functions  &#183;  OpenAI gpt-4o / gpt-4o-mini  &#183;  Next.js API Routes</text>
  <rect x="20" y="130" width="1160" height="310" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="20" y="450" width="1160" height="225" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="20" y="685" width="1160" height="270" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="35" y="148" font-size="10" font-weight="700" fill="#1d4ed8" letter-spacing="0.5">PHASE 1  &#183;  UPLOAD &amp; TEXT EXTRACTION</text>
  <text x="35" y="467" font-size="10" font-weight="700" fill="#6d28d9" letter-spacing="0.5">PHASE 2  &#183;  AI TOPIC EXTRACTION</text>
  <text x="35" y="703" font-size="10" font-weight="700" fill="#15803d" letter-spacing="0.5">PHASE 3  &#183;  QUESTION GENERATION</text>
  <rect x="20" y="63" width="140" height="46" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="90" y="90" font-size="12" font-weight="600" text-anchor="middle" fill="#1e40af">Browser</text>
  <rect x="200" y="63" width="140" height="46" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="270" y="90" font-size="12" font-weight="600" text-anchor="middle" fill="#92400e">Next.js API</text>
  <rect x="410" y="63" width="140" height="46" rx="8" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="480" y="82" font-size="12" font-weight="600" text-anchor="middle" fill="#3730a3">Edge Functions</text>
  <text x="480" y="99" font-size="10.5" text-anchor="middle" fill="#3730a3">(Supabase)</text>
  <rect x="630" y="63" width="140" height="46" rx="8" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="700" y="82" font-size="12" font-weight="600" text-anchor="middle" fill="#065f46">OpenAI API</text>
  <text x="700" y="99" font-size="10.5" text-anchor="middle" fill="#065f46">gpt-4o / mini</text>
  <rect x="820" y="63" width="140" height="46" rx="8" fill="#fed7aa" stroke="#fdba74" stroke-width="1.5"/>
  <text x="890" y="82" font-size="12" font-weight="600" text-anchor="middle" fill="#7c2d12">Supabase</text>
  <text x="890" y="99" font-size="10.5" text-anchor="middle" fill="#7c2d12">Storage</text>
  <rect x="1020" y="63" width="140" height="46" rx="8" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="1090" y="82" font-size="12" font-weight="600" text-anchor="middle" fill="#581c87">Supabase</text>
  <text x="1090" y="99" font-size="10.5" text-anchor="middle" fill="#581c87">Database</text>
  <line x1="90" y1="109" x2="90" y2="960" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="270" y1="109" x2="270" y2="960" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="480" y1="109" x2="480" y2="960" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="700" y1="109" x2="700" y2="960" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="890" y1="109" x2="890" y2="960" stroke="#fdba74" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="1090" y1="109" x2="1090" y2="960" stroke="#d8b4fe" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="90" y1="165" x2="879" y2="165" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <rect x="336" y="144" width="308" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="490" y="154" font-size="10.5" text-anchor="middle" fill="#2563eb">(1) Upload file directly  (.pdf / .docx / .txt,  max 50MB)</text>
  <line x1="90" y1="205" x2="259" y2="205" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <rect x="106" y="184" width="148" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="180" y="194" font-size="10.5" text-anchor="middle" fill="#2563eb">(2) POST /document-sources</text>
  <line x1="270" y1="245" x2="1079" y2="245" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <rect x="559" y="224" width="243" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="680" y="234" font-size="10.5" text-anchor="middle" fill="#2563eb">(3) INSERT document_source  (status: pending)</text>
  <line x1="270" y1="285" x2="101" y2="285" stroke="#059669" stroke-width="1.5" marker-end="url(#a-green)"/>
  <rect x="126" y="264" width="108" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="180" y="274" font-size="10.5" text-anchor="middle" fill="#059669">(4) { documentId }</text>
  <line x1="270" y1="325" x2="469" y2="325" stroke="#ea580c" stroke-width="1.5" marker-end="url(#a-orange)"/>
  <rect x="234" y="304" width="283" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="375" y="314" font-size="10.5" text-anchor="middle" fill="#ea580c">(5) invoke extract-document-topics  (fire-and-forget)</text>
  <line x1="480" y1="365" x2="879" y2="365" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <rect x="566" y="344" width="238" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="685" y="354" font-size="10.5" text-anchor="middle" fill="#2563eb">(6) createSignedUrl  ->  download file bytes</text>
  <path d="M 490,400 L 548,400 L 548,420 L 495,420" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="489" y="385" width="156" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="567" y="396" font-size="10.5" text-anchor="middle" fill="#2563eb">(7) parse text (format-based)</text>
  <rect x="552" y="398" width="218" height="34" rx="5" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
  <text x="661" y="411" font-size="9.5" font-weight="600" text-anchor="middle" fill="#92400e">PDF: unpdf (fast)  &#183;  DOCX: XML regex  &#183;  TXT: decode</text>
  <text x="661" y="426" font-size="9" text-anchor="middle" fill="#78350f">gpt-4o fallback: scanned PDF only (no text layer)</text>
  <line x1="480" y1="480" x2="1079" y2="480" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <rect x="714" y="459" width="143" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="785" y="469" font-size="10.5" text-anchor="middle" fill="#2563eb">(8) UPDATE extracted_text</text>
  <line x1="480" y1="518" x2="689" y2="518" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
  <rect x="451" y="497" width="278" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="590" y="507" font-size="10.5" text-anchor="middle" fill="#7c3aed">(9) gpt-4o: extract topics  (chunks, max 4 parallel)</text>
  <line x1="700" y1="556" x2="491" y2="556" stroke="#059669" stroke-width="1.5" marker-end="url(#a-green)"/>
  <rect x="461" y="535" width="258" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="590" y="545" font-size="10.5" text-anchor="middle" fill="#059669">(10) topics JSON  { title, summary, key_points }</text>
  <line x1="480" y1="594" x2="1079" y2="594" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <rect x="619" y="573" width="333" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="785" y="583" font-size="10.5" text-anchor="middle" fill="#2563eb">(11) INSERT document_topics  &#183;  UPDATE status=topics_ready</text>
  <line x1="90" y1="643" x2="259" y2="643" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="11" y="622" width="338" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="180" y="632" font-size="10.5" text-anchor="middle" fill="#94a3b8">(12) poll GET /document-sources/{id}  every 3s  ->  topics_ready</text>
  <rect x="648" y="506" width="74" height="16" rx="8" fill="#059669"/>
  <text x="685" y="518" font-size="9.5" font-weight="600" text-anchor="middle" fill="#fff">gpt-4o</text>
  <rect x="490" y="506" width="105" height="16" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="542" y="518" font-size="9" text-anchor="middle" fill="#6d28d9">max 4 parallel</text>
  <line x1="90" y1="712" x2="259" y2="712" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <rect x="4" y="691" width="353" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="180" y="701" font-size="10.5" text-anchor="middle" fill="#2563eb">(13) POST /generate-questions  { approvedTopicIds, perTopicCounts }</text>
  <line x1="270" y1="750" x2="469" y2="750" stroke="#ea580c" stroke-width="1.5" marker-end="url(#a-orange)"/>
  <rect x="221" y="729" width="308" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="375" y="739" font-size="10.5" text-anchor="middle" fill="#ea580c">(14) invoke generate-questions-from-doc  (fire-and-forget)</text>
  <line x1="1090" y1="788" x2="491" y2="788" stroke="#059669" stroke-width="1.5" marker-end="url(#a-green)"/>
  <rect x="679" y="767" width="213" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="785" y="777" font-size="10.5" text-anchor="middle" fill="#059669">(15) topics + extracted_text  (from DB)</text>
  <line x1="480" y1="826" x2="689" y2="826" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
  <rect x="434" y="805" width="313" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="590" y="815" font-size="10.5" text-anchor="middle" fill="#7c3aed">(16) gpt-4o-mini: gen questions per topic  (max 4 parallel)</text>
  <line x1="700" y1="864" x2="491" y2="864" stroke="#059669" stroke-width="1.5" marker-end="url(#a-green)"/>
  <rect x="434" y="843" width="313" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="590" y="853" font-size="10.5" text-anchor="middle" fill="#059669">(17) questions JSON  { question_text, type, level, answer }</text>
  <line x1="480" y1="902" x2="1079" y2="902" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <rect x="654" y="881" width="263" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="785" y="891" font-size="10.5" text-anchor="middle" fill="#2563eb">(18) INSERT questions  &#183;  UPDATE status=done</text>
  <line x1="90" y1="942" x2="259" y2="942" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <rect x="41" y="921" width="278" height="13" rx="2" fill="#fff" fill-opacity="0.93"/>
  <text x="180" y="931" font-size="10.5" text-anchor="middle" fill="#2563eb">(19) poll  ->  done  ->  questions loaded into Skill</text>
  <rect x="636" y="814" width="108" height="16" rx="8" fill="#047857"/>
  <text x="690" y="826" font-size="9.5" font-weight="600" text-anchor="middle" fill="#fff">gpt-4o-mini</text>
  <rect x="490" y="814" width="105" height="16" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="542" y="826" font-size="9" text-anchor="middle" fill="#6d28d9">max 4 parallel</text>
  <text x="25" y="975" font-size="9.5" font-weight="600" fill="#374151">Legend:</text>
  <line x1="80" y1="970" x2="108" y2="970" stroke="#2563eb" stroke-width="2"/>
  <polygon points="108,967 116,970 108,973" fill="#2563eb"/>
  <text x="122" y="975" font-size="9.5" fill="#374151">Request / Write</text>
  <line x1="222" y1="970" x2="250" y2="970" stroke="#059669" stroke-width="2"/>
  <polygon points="250,967 258,970 250,973" fill="#059669"/>
  <text x="264" y="975" font-size="9.5" fill="#374151">Response / Return</text>
  <line x1="370" y1="970" x2="398" y2="970" stroke="#ea580c" stroke-width="2"/>
  <polygon points="398,967 406,970 398,973" fill="#ea580c"/>
  <text x="412" y="975" font-size="9.5" fill="#374151">Fire-and-forget</text>
  <line x1="515" y1="970" x2="543" y2="970" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="543,967 551,970 543,973" fill="#7c3aed"/>
  <text x="557" y="975" font-size="9.5" fill="#374151">OpenAI API call</text>
  <line x1="655" y1="970" x2="683" y2="970" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="683,967 691,970 683,973" fill="#94a3b8"/>
  <text x="697" y="975" font-size="9.5" fill="#374151">Poll</text>
