name: branch-policy

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source and target branches
        id: validate
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          valid=false
          expected=''
          if [[ "$BASE_REF" == "main" ]]; then
            expected='release/<version> or hotfix/<slug>'
            [[ "$HEAD_REF" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ || "$HEAD_REF" =~ ^hotfix/[^/]+$ ]] && valid=true
          elif [[ "$BASE_REF" == "develop" ]]; then
            expected='develop-<member> or feature/<slug>'
            [[ "$HEAD_REF" =~ ^develop-[a-z0-9-]+$ || "$HEAD_REF" =~ ^feature/[^/]+$ ]] && valid=true
          else
            expected='a supported integration branch'
          fi

          if [[ "$valid" != true ]]; then
            echo "::error title=Invalid pull request flow::${HEAD_REF} must target ${BASE_REF} using ${expected}."
            echo "expected=${expected}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Branch policy passed: ${HEAD_REF} -> ${BASE_REF}"

      - name: Explain invalid pull request flow
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- branch-policy-warning -->';
            const base = context.payload.pull_request.base.ref;
            const head = context.payload.pull_request.head.ref;
            const expectedForDevelop = '`develop-<member>` or `feature/<slug>`';
            const expectedForMain = '`release/<version>` or `hotfix/<slug>`';
            const body = `${marker}
            ⚠️ **Pull request flow violation**

            This PR targets \`${base}\` from \`${head}\`, which is not allowed.

            Expected flow:
            - PRs to \`develop\`: ${expectedForDevelop}
            - PRs to \`main\`: ${expectedForMain}

            **Stop here:** edit the PR base branch to `develop` or create the correct release branch. This check must pass before merging.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
