name: docker-publish

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: GitHub Environment whose NEXT_PUBLIC_* vars are baked into the image
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production')) && 'ghcr-production-latest' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production')) }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || (github.ref == 'refs/heads/develop' && 'staging' || 'production') }}
    outputs:
      image: ${{ steps.image.outputs.image }}
      should_deploy: ${{ steps.image.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v7

      - id: image
        env:
          ENVIRONMENT_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || (github.ref == 'refs/heads/develop' && 'staging' || 'production') }}
        run: |
          set -euo pipefail
          sha_tag="ghcr.io/dattran26/down-town:sha-${GITHUB_SHA::7}"
          echo "image=${sha_tag}" >> "$GITHUB_OUTPUT"
          deploy=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            deploy=true
          elif [ "${{ github.ref }}" = "refs/heads/develop" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            deploy=true
          fi
          echo "should_deploy=${deploy}" >> "$GITHUB_OUTPUT"

      - name: Require public build-args
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_ENABLE_TURNSTILE: ${{ vars.NEXT_PUBLIC_ENABLE_TURNSTILE }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          ENVIRONMENT_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || (github.ref == 'refs/heads/develop' && 'staging' || 'production') }}
        run: |
          set -euo pipefail
          test -n "${NEXT_PUBLIC_SUPABASE_URL}"
          test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
          if [ "${ENVIRONMENT_NAME}" = "production" ]; then
            test -n "${NEXT_PUBLIC_APP_URL}"
          fi
          if [ "${NEXT_PUBLIC_ENABLE_TURNSTILE}" = "true" ]; then
            test -n "${NEXT_PUBLIC_TURNSTILE_SITE_KEY}"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/dattran26/down-town
          tags: |
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production') }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: Frontend
          file: Frontend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_ENABLE_TURNSTILE=${{ vars.NEXT_PUBLIC_ENABLE_TURNSTILE }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  build-sidecars:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sidecar:
          - name: vision-ai
            context: modules/vision-ai/backend
            file: modules/vision-ai/backend/Dockerfile
            image: ghcr.io/dattran26/down-town-vision-ai
          - name: vision-ocr
            context: modules/vision-ocr/backend
            file: modules/vision-ocr/backend/Dockerfile
            image: ghcr.io/dattran26/down-town-vision-ocr
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ matrix.sidecar.image }}
          tags: |
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production') }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.sidecar.context }}
          file: ${{ matrix.sidecar.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.sidecar.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.sidecar.name }}

  deploy:
    needs: [build, build-sidecars]
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || (github.ref == 'refs/heads/develop' && 'staging' || 'production') }}
    steps:
      - uses: actions/checkout@v7

      - name: Sync compose files and recreate stack
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || 'root' }}
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          DOCKER_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_KNOWN_HOSTS}"
          test -n "${VPS_HOST}"
          test -n "${VPS_USER}"
          test -n "${DEPLOY_PATH}"
          test -n "${DOCKER_IMAGE}"
          SHA7="${GITHUB_SHA::7}"
          VISION_AI_IMAGE="ghcr.io/dattran26/down-town-vision-ai:sha-${SHA7}"
          VISION_OCR_IMAGE="ghcr.io/dattran26/down-town-vision-ocr:sha-${SHA7}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          SSH=(ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts -o IdentitiesOnly=yes -o BatchMode=yes)
          RSH="${SSH[*]} -o StrictHostKeyChecking=yes"
          rsync -az -e "${RSH}" \
            docker-compose.yml \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/"
          rsync -az -e "${RSH}" \
            deploy/vps/ \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/deploy/vps/"
          TOKEN_FILE="${DEPLOY_PATH}/.ghcr-token.tmp"
          printf '%s' "${GHCR_TOKEN}" | "${SSH[@]}" "${VPS_USER}@${VPS_HOST}" "cat > '${TOKEN_FILE}' && chmod 600 '${TOKEN_FILE}'"
          "${SSH[@]}" "${VPS_USER}@${VPS_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' DOCKER_IMAGE='${DOCKER_IMAGE}' VISION_AI_IMAGE='${VISION_AI_IMAGE}' VISION_OCR_IMAGE='${VISION_OCR_IMAGE}' GHCR_USER='${GHCR_USER}' GHCR_TOKEN_FILE='${TOKEN_FILE}' bash '${DEPLOY_PATH}/deploy/vps/remote-up.sh'"
          shred -u ~/.ssh/id_ed25519 || rm -f ~/.ssh/id_ed25519
